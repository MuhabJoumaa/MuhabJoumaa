name: Update Stats Cards

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate most used languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&show_icons=true&bg_color=0D1117&title_color=00FF99&text_color=FFFFFF&layout=compact&langs_count=10
          path: profile/most-used-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate profile details card
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 5 \
            -o profile/profile-details.svg \
            "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=${{ github.repository_owner }}&theme=github_dark"

      - name: Install dependencies
        run: |
          pip install playwright pillow numpy
          playwright install --with-deps chromium

      - name: Compose stats
        run: python scripts/compose_github_stats.py

      - name: Make animated github stats dashboard
        run: python scripts/make_animated_github_stats_dashboard.py

      - name: Add glitch and neon and shine effects
        run: python scripts/add_three_effects.py

      - name: Add glow particles
        run: python scripts/add_glow_particles.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/most-used-langs.svg
          git add profile/stats.svg
          git add profile/profile-details.svg
          git add profile/github-dashboard.png
          git add profile/github-dashboard.gif
          git add profile/github-dashboard-fx.gif
          git add profile/github-dashboard-glow.gif
          git diff --staged --quiet || git commit -m "Update statistics cards"
          git push
